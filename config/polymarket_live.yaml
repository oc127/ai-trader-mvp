# Polymarket LIVE Trading Configuration
# REAL MONEY — conservative settings, prioritize capital preservation

polymarket:
  paper_mode: false

  # Known account balance (fallback when API can't query proxy wallet balance)
  initial_balance: 59.0

  # Proxy wallet address (the actual trading address on Polymarket)
  # Set this OR POLYMARKET_FUNDER_ADDRESS in .env
  funder_address: "0x8cf9DD5089Eb8458bFbD0A541D5D64Fe994e2dE3"

  # Chain
  chain_id: 137  # Polygon mainnet
  signature_type: 3  # POLY_1271 — Deposit Wallet (EIP-1271 smart contract wallet)

  # Rate limiting
  rate_limit_delay: 0.25  # slightly more conservative than paper

  # ── HFT Market Maker (Layer 1) ──
  hf_market_maker:
    # Spread — wider in live to protect against adverse selection
    min_half_spread: 0.01       # 1 cent minimum half-spread
    max_half_spread: 0.06       # widen up to 6 cents under stress

    # Inventory skew
    skew_factor: 0.015          # stronger skew to reduce directional risk

    # Sizing — START SMALL, scale up after profitable days
    quote_size_usd: 10.0        # $10 per side (half of paper)
    max_position_per_market: 50.0   # $50 max per market
    max_total_exposure: 150.0       # $150 total across all markets

    # Market selection — find markets with quotable spreads
    min_market_liquidity: 5000      # $5K minimum (wider spreads here)
    min_market_volume_24h: 1000     # $1K 24h volume minimum
    min_book_spread: 0.0            # disabled — place resting orders regardless
    price_band_low: 0.15            # avoid extremes
    price_band_high: 0.85
    max_markets: 5                  # more markets = more chances

    # Inventory management — aggressive flatten
    max_inventory_age_seconds: 180  # flatten after 3 minutes (not 5)
    flatten_at_pct: 0.70            # flatten at 70% of max (not 80%)

    # Risk — tight stops
    max_daily_loss: 25.0            # stop at $25 loss (half of paper)
    max_consecutive_losses: 3       # pause after 3 consecutive losses
    pause_after_loss_seconds: 300   # 5 min cooldown (longer than paper)

  # ── Cycle timing ──
  cycle_interval_seconds: 5        # 5-second fast cycles
  scan_interval_seconds: 120       # rescan markets every 2 minutes
  report_interval_seconds: 300     # status report every 5 minutes

  # ── Layer toggles ──
  maker_enabled: true
  edge_enabled: true
  copy_enabled: true

  # ── Scanner (for edge detection) ──
  scanner:
    min_edge: 0.07              # 7% minimum edge (stricter)
    min_volume: 20000
    min_liquidity: 10000
    max_price: 0.85
    min_price: 0.15
    market_limit: 100

  # ── Strategy (edge layer) ──
  strategy:
    min_edge: 0.07
    reversion_size: 0.06        # smaller mean reversion adjustment
    vol_liq_threshold: 2.0

  # ── Risk management (4-layer circuit breakers + dynamic sizing) ──
  risk:
    max_position_usd: 200
    max_total_exposure_usd: 500
    max_single_market_pct: 0.15   # 15% max in one market
    max_daily_trades: 30
    max_daily_loss_usd: 100
    min_kelly: 0.02
    max_kelly: 0.05               # very conservative Kelly cap
    min_edge: 0.07
    min_confidence: "medium"
    max_errors_before_halt: 5     # halt faster on errors
    # multi-layer circuit breakers (conservative for live)
    max_monthly_loss_usd: 300     # L2: $300 monthly cap
    max_drawdown_pct: 0.15        # L3: 15% max drawdown
    max_total_loss_pct: 0.30      # L4: 30% lifetime halt
    # dynamic sizing
    loss_shrink_pct: 0.25         # shrink faster in live
    win_grow_pct: 0.05            # grow slower in live
    max_streak_adjustment: 0.40   # more aggressive floor

  # ── Arbitrage (conservative for live) ──
  arbitrage:
    min_net_profit: 0.01          # $0.01 minimum (higher than paper)
    min_roi_pct: 0.5              # 0.5% minimum ROI
    max_arb_size_usd: 30.0        # smaller max per trade
    min_liquidity: 10000          # higher liquidity requirement
    min_volume: 5000
    snipe_min_price: 0.96         # stricter snipe threshold
    snipe_max_price: 0.995

  # ── Copy Trading (conservative for live) ──
  copy_trading:
    min_pnl: 1000.0               # higher PnL requirement
    min_win_rate: 0.65            # stricter win rate
    min_profit_factor: 2.0        # higher profit factor
    min_trades: 50                # more history required
    max_traders_to_follow: 5      # fewer traders
    copy_size_pct: 0.05           # 5% of their size (half of paper)
    max_copy_size_usd: 15.0       # smaller max
    min_copy_size_usd: 2.0
    scan_interval: 180.0          # check every 3 min
    trade_delay: 10.0             # longer delay
    cooldown_per_trader: 600.0    # 10 min cooldown

# Smart bot settings (edge layer)
smart_bot:
  cycle_interval_seconds: 30
  scan_interval_seconds: 300
  max_trades_per_cycle: 1         # 1 trade per cycle in live
  position_timeout_seconds: 1800  # 30 min timeout (shorter)
  stop_loss_multiplier: 1.5       # tighter stop loss

# AI edge (optional, requires LLM API key)
ai_edge:
  enabled: false
  min_edge: 0.07
  min_confidence: "high"          # require high confidence in live
  max_markets_per_cycle: 5
  analysis_cache_seconds: 900     # cache longer to save API costs

logging:
  level: INFO
  format: text
