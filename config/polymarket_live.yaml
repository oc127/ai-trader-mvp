# Polymarket LIVE Trading Configuration
# REAL MONEY — $25 cash, directional + snipe focus (no maker)

polymarket:
  paper_mode: false

  # Known account balance (fallback when API can't query proxy wallet balance)
  initial_balance: 25.0

  # Proxy wallet address (the actual trading address on Polymarket)
  # Set this OR POLYMARKET_FUNDER_ADDRESS in .env
  funder_address: "0x8cf9DD5089Eb8458bFbD0A541D5D64Fe994e2dE3"

  # Chain
  chain_id: 137  # Polygon mainnet
  signature_type: 3  # POLY_1271 — Deposit Wallet (EIP-1271 smart contract wallet)

  # Rate limiting
  rate_limit_delay: 0.15  # faster API calls for throughput

  # ── Market Maker (Layer 1) — DISABLED with $25 ──
  hf_market_maker:
    min_half_spread: 0.01
    max_half_spread: 0.03
    skew_factor: 0.01
    quote_size_usd: 5.0
    max_position_per_market: 15.0
    max_total_exposure: 25.0
    min_market_liquidity: 5000
    min_market_volume_24h: 2000
    min_book_spread: 0.0
    price_band_low: 0.10
    price_band_high: 0.90
    max_markets: 8
    max_inventory_age_seconds: 600
    flatten_at_pct: 0.60
    max_daily_loss: 10.0
    max_consecutive_losses: 10
    pause_after_loss_seconds: 60

  # ── Cycle timing ──
  cycle_interval_seconds: 3        # 3-second cycles
  scan_interval_seconds: 60        # rescan markets every 60s
  report_interval_seconds: 300     # status report every 5 minutes

  # ── Layer toggles ──
  maker_enabled: false             # OFF — $25 cash not enough
  edge_enabled: true
  copy_enabled: true

  # ── Scanner (for edge detection) ──
  scanner:
    min_edge: 0.03              # 3% minimum edge
    min_volume: 5000
    min_liquidity: 5000
    max_price: 0.95
    min_price: 0.05
    market_limit: 200           # scan broadly

  # ── Strategy (edge layer) ──
  strategy:
    min_edge: 0.03              # 3% — catch directional signals
    reversion_size: 0.06        # 6% reversion target
    vol_liq_threshold: 2.0
    extreme_low: 0.20           # wider extreme band
    extreme_high: 0.80

  # ── Risk management (4-layer circuit breakers) ──
  risk:
    max_position_usd: 10          # $10 max single position
    max_total_exposure_usd: 20    # $20 total
    max_single_market_pct: 0.40   # 40% max in one market (small account)
    max_daily_trades: 50
    max_daily_loss_usd: 5         # $5 daily stop (20% of cash)
    min_kelly: 0.01
    max_kelly: 0.10               # higher Kelly — small account, bet bigger on edge
    min_edge: 0.03                # 3% min edge
    min_confidence: "low"         # accept low confidence with small sizes
    max_errors_before_halt: 5
    # multi-layer circuit breakers
    max_monthly_loss_usd: 10      # L2: $10 monthly cap
    max_drawdown_pct: 0.20        # L3: 20% max drawdown
    max_total_loss_pct: 0.30      # L4: 30% lifetime halt
    # dynamic sizing
    loss_shrink_pct: 0.25
    win_grow_pct: 0.15            # grow 15% on wins — compound faster
    max_streak_adjustment: 0.50

  # ── Arbitrage (arbs + resolution snipes) ──
  arbitrage:
    min_net_profit: 0.005
    min_roi_pct: 0.3
    max_arb_size_usd: 10.0        # $10 max per arb (small account)
    min_liquidity: 5000
    min_volume: 2000
    snipe_min_price: 0.90         # snipe 90¢+ tokens
    snipe_max_price: 0.995

  # ── Copy Trading ──
  copy_trading:
    min_pnl: 500.0
    min_win_rate: 0.60
    min_profit_factor: 1.5
    min_trades: 30
    max_traders_to_follow: 8
    copy_size_pct: 0.02           # 2% of their size
    max_copy_size_usd: 8.0        # $8 max per copy (small account)
    min_copy_size_usd: 2.0
    scan_interval: 60.0
    trade_delay: 5.0
    cooldown_per_trader: 300.0

# Smart bot settings (edge layer)
smart_bot:
  cycle_interval_seconds: 15
  scan_interval_seconds: 120
  max_trades_per_cycle: 2         # 2 trades per cycle
  position_timeout_seconds: 1800  # 30 min timeout
  stop_loss_multiplier: 1.5

# AI edge (optional, requires LLM API key)
ai_edge:
  enabled: false
  min_edge: 0.05
  min_confidence: "high"
  max_markets_per_cycle: 5
  analysis_cache_seconds: 900

logging:
  level: INFO
  format: text
