market_maker:
  # 交易对 — 选流动性中等、spread 较大的小币种
  # spread 太小的大币种（BTC/ETH）散户做市没优势，会被专业做市商吃掉
  pairs:
    - DOGE_USDT
    - PEPE_USDT

  # 报价参数
  base_spread_bps: 10          # 基础 spread 10bps（0.1%）
  min_spread_bps: 5            # 最小 spread 5bps
  num_tiers: 3                 # 每侧3档报价
  tier_spacing_bps: 5          # 每档间距 5bps
  tier_size_multiplier: 1.5    # 外档 size 是内档的 1.5 倍
  base_order_usd: 50           # 最内档 $50

  # 库存管理
  max_inventory_usd: 2000      # 单币种最大库存 $2000
  max_total_inventory_usd: 5000 # 所有币种总库存上限 $5000
  skew_intensity: 1.0          # 库存偏移强度（1.0 = 标准）

  # 波动性控制
  volatility_threshold_pct: 0.005  # 0.5% 价格变动触发 spread 加宽
  volatility_widen_factor: 2.0     # 波动时 spread 翻倍

  # 执行
  refresh_interval_sec: 5      # 每 5 秒刷新报价
  max_open_orders: 20          # 最大挂单数

  # 精度（Gate.io 每个交易对不同，需要根据实际调整）
  price_precision:
    DOGE_USDT: 5               # $0.00001
    PEPE_USDT: 10              # 极小价格需要更多位
  amount_precision:
    DOGE_USDT: 0               # 整数
    PEPE_USDT: 0               # 整数

risk:
  max_daily_loss_usd: 100      # 日亏损上限 $100
  max_drawdown_pct: 0.05       # 最大回撤 5%
  halt_on_error_count: 5       # 连续 5 次错误暂停

monitor:
  telegram_enabled: true
  summary_interval_sec: 1800   # 每 30 分钟汇报一次
